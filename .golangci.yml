version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - gosec
    - unconvert
    - dupl
    - goconst
    - gocognit
    - goheader
    - gocritic
    - revive
    - misspell
    - lll
    - unparam
    - nakedret
    - prealloc
    - exhaustive
    - nilerr
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true
      disable:
        - fieldalignment # Disabled when performance is not critical

    gocyclo:
      min-complexity: 15

    goconst:
      min-len: 2
      min-occurrences: 2

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
        - hugeParam

    misspell:
      locale: US

    lll:
      line-length: 140

    unparam:
      check-exported: false

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

  exclusions:
    rules:
      # Exclude some linters from running on tests files.
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - goconst

      # Exclude known linters from partially hard-to-fix problems
      - path: examples/
        linters:
          - errcheck
          - gosec
          - gocritic

      # Exclude revive stutter warnings for WalletCard* types (intentional API design)
      - text: "type name will be used as wallet.Wallet"
        linters:
          - revive

      # Exclude shadow checking on the variable named err
      - text: 'shadow: declaration of "err"'
        linters:
          - govet

      # Exclude lll issues for long lines with go:generate
      - linters:
          - lll
        source: "^//go:generate "

      # errcheck: Almost all programs ignore errors on these functions and in most cases it's ok
      - text: "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*printf?|os\\.(Un)?Setenv). is not checked"
        linters:
          - errcheck

      # govet: Common false positives
      - text: "possible misuse of unsafe.Pointer"
        linters:
          - govet

      - text: "should have signature"
        linters:
          - govet

      # staticcheck: Developers tend to write in C-style with an explicit 'break' in a 'switch', so it's ok to ignore
      - text: "ineffective break statement. Did you mean to break out of the outer loop"
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/abyssparanoia/samsung-wallet-go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

severity:
  default: error
